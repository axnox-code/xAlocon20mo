id: hashicorp-vault-token

info:
  name: HashiCorp Vault Token Disclosure
  author: reewardius
  severity: critical
  metadata:
    verified: true
    max-request: 1
  tags: disclosure,vault,exposure,hashicorp,secrets

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: regex
        part: body
        regex:
          - 'hvs\.[A-Za-z0-9_-]{24}'
