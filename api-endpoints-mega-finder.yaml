      - "{{BaseURL}}/api/playground"

    matchers-condition: or
    matchers:
      # ============ STATUS CODE MATCHERS ============
      - type: status
        status:
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 405
          - 406
          - 409
          - 410
          - 415
          - 418
          - 429
          - 500
          - 501
          - 502
          - 503
          - 504

      # ============ HEADER MATCHERS ============
      - type: word
        part: header
        words:
          - 'Content-Type: application/json'
          - 'Content-Type: application/hal+json'
          - 'Content-Type: application/vnd.api+json'
          - 'Content-Type: application/problem+json'
          - 'Content-Type: application/xml'
          - 'Content-Type: application/hal+xml'
          - 'Content-Type: application/ld+json'
          - 'Content-Type: application/geo+json'
          - 'X-Powered-By: Express'
          - 'X-Powered-By: PHP'
          - 'X-Powered-By: ASP.NET'
          - 'X-Powered-By: Spring'
          - 'X-Powered-By: Django'
          - 'X-Powered-By: Flask'
          - 'X-Powered-By: Rails'
          - 'X-Powered-By: Laravel'
          - 'Server: nginx'
          - 'Server: Apache'
          - 'Server: Microsoft-IIS'
          - 'Server: Cloudflare'
          - 'Server: AWS'
          - 'Server: GCP'
          - 'Server: Azure'
          - 'Access-Control-Allow-Origin:'
          - 'Access-Control-Allow-Methods:'
          - 'Access-Control-Allow-Headers:'
          - 'Access-Control-Expose-Headers:'
          - 'Access-Control-Max-Age:'
          - 'Access-Control-Allow-Credentials:'
          - 'WWW-Authenticate:'
          - 'Authorization:'
          - 'X-Auth-Token:'
          - 'X-API-Key:'
          - 'X-API-Version:'
          - 'API-Version:'
          - 'GraphQL-Preflight:'
          - 'X-GraphQL:'
          - 'X-Swagger-UI:'

      # ============ BODY MATCHERS - RESPONSE PATTERNS ============
      - type: word
        part: body
        words:
          - '"status": "ok"'
          - '"status": "success"'
          - '"status": "error"'
          - '"status": "failed"'
          - '"success": true'
          - '"success": false'
          - '"error":'
          - '"errors":'
          - '"message":'
          - '"data":'
          - '"data": {'
          - '"data": ['
          - '"result":'
          - '"results":'
          - '"total":'
          - '"count":'
          - '"items":'
          - '"page":'
          - '"limit":'
          - '"offset":'
          - '"sort":'
          - '"filter":'
          - '"code":'
          - '"token":'
          - '"access_token":'
          - '"refresh_token":'
          - '"expires_in":'
          - '"token_type":'
          - '"id":'
          - '"name":'
          - '"email":'
          - '"username":'
          - '"created_at":'
          - '"updated_at":'
          - '"deleted_at":'
          - '"metadata":'
          - '"links":'
          - '"href":'
          - '"rel":'
          - '"method":'
          - '"description":'
          - '"summary":'
          - '"operationId":'
          - '"parameters":'
          - '"responses":'
          - '"schemas":'
          - '"definitions":'
          - '"properties":'
          - '"required":'
          - '"type":'
          - '"enum":'
          - '"format":'
          - '"minimum":'
          - '"maximum":'
          - '"pattern":'
          - '"default":'
          - '"example":'
          - '"examples":'
          - '"$ref":'
          - '"allOf":'
          - '"anyOf":'
          - '"oneOf":'
          - '"not":'
          - '"items":'
          - '"additionalProperties":'
          - '"discriminator":'
          - '"readOnly":'
          - '"writeOnly":'
          - '"deprecated":'
          - '"openapi":'
          - '"swagger":'
          - '"info":'
          - '"paths":'
          - '"components":'
          - '"security":'
          - '"tags":'
          - '"externalDocs":'
          - '"x-":'
          - '"query":'
          - '"mutation":'
          - '"subscription":'
          - '"__typename":'
          - '"__schema":'
          - '"__type":'
          - '"typeDefs":'
          - '"resolvers":'
          - '"context":'

      # ============ API FINGERPRINTING ============
      - type: word
        part: body
        words:
          - '"swagger":"2.0"'
          - '"swagger":"3.0"'
          - '"openapi":"3.0.0"'
          - '"openapi":"3.0.1"'
          - '"openapi":"3.0.2"'
          - '"openapi":"3.0.3"'
          - '"openapi":"3.1.0"'
          - '"graphql": true'
          - '"extensions": {'
          - '"extensions": ['
          - '"@graphql":'
          - '"__graphql":'
          - '"data": { "__typename":'
          - '"errors": [{ "extensions":'
          - '"x-graphql":'
          - '"graphql-playground":'

      # ============ XML MATCHERS ============
      - type: regex
        part: body
        regex:
          - '<\?xml version="1.0" encoding="[^"]+"\?>'
          - '<soap:Envelope'
          - '<wsdl:definitions'
          - '<xsd:schema'
          - '<wadl:application'
          - '<REST'

      # ============ HTML MATCHERS ============
      - type: regex
        part: body
        regex:
          - '<title>.*API.*</title>'
          - '<title>.*Swagger.*</title>'
          - '<title>.*GraphQL.*</title>'
          - '<title>.*Playground.*</title>'
          - '<title>.*Documentation.*</title>'
          - 'Swagger UI'
          - 'GraphiQL'
          - 'GraphQL Playground'
          - 'API Documentation'
          - 'REST API'
          - 'RESTful API'

    extractors:
      # ============ EXTRACT VERSION ============
      - type: regex
        name: api_version
        part: header
        regex:
          - 'X-API-Version: v([0-9]+(?:\.[0-9]+)*)'
          - 'API-Version: ([0-9]+(?:\.[0-9]+)*)'
          - 'Version: ([0-9]+(?:\.[0-9]+)*)'

      # ============ EXTRACT SERVER TECH ============
      - type: regex
        name: server_tech
        part: header
        regex:
          - 'Server: ([^\r\n]+)'
          - 'X-Powered-By: ([^\r\n]+)'

      # ============ EXTRACT RESPONSE SIZE ============
      - type: regex
        name: response_size
        part: header
        regex:
          - 'Content-Length: ([0-9]+)'

      # ============ EXTRACT RESPONSE TYPE ============
      - type: regex
        name: content_type
        part: header
        regex:
          - 'Content-Type: ([^\r\n]+)'

      # ============ EXTRACT DATA FROM JSON ============
      - type: regex
        name: api_data
        part: body
        regex:
          - '"data"\s*:\s*\{[^{}]*\}'
          - '"result"\s*:\s*\{[^{}]*\}'
          - '"results"\s*:\s*\[[^\]]*\]'
          - '"items"\s*:\s*\[[^\]]*\]'

      # ============ EXTRACT TITLES ============
      - type: regex
        name: page_title
        part: body
        regex:
          - '<title>([^<]+)</title>'
