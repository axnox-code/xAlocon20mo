      - "{{BaseURL}}/router/"
      
      # ============ DEV TOOLS ============
      - "{{BaseURL}}/api/test"
      - "{{BaseURL}}/api/testing"
      - "{{BaseURL}}/api/demo"
      - "{{BaseURL}}/api/sandbox"
