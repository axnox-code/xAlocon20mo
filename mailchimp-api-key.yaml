id: mailchimp-api-key

info:
  name: Mailchimp API Key Disclosure
  author: reewardius
  severity: high
  metadata:
    verified: true
    max-request: 1
  tags: disclosure,mailchimp,exposure,email

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: regex
        part: body
        regex:
          - '[A-Za-z0-9]{32}-us[0-9]{1,2}'
