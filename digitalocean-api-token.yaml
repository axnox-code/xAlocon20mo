id: digitalocean-api-token

info:
  name: DigitalOcean API Token Disclosure
  author: reewardius
  severity: high
  metadata:
    verified: true
    max-request: 1
  tags: disclosure,digitalocean,exposure,cloud

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: regex
        part: body
        regex:
          - 'dop_v1_[A-Za-z0-9]{64}'
