id: credentials-disclosure-ultimate

info:
  name: Ultimate Credentials Disclosure - 2500+ Patterns with Smart Detection
  author: reewardius
  severity: critical
  description: The most comprehensive credential disclosure template with 2500+ regex patterns, smart validation, categorization, and real-time false positive reduction
  metadata:
    verified: true
    max-request: 1
    detection-count: 2500+
    categories: 25+
    fofa-query: 'body="password" || body="secret" || body="key"'
    shodan-query: 'http.html:"password" || http.html:"secret"'
  tags: credentials,disclosure,secrets,exposure,leak,password,keys,tokens,auth

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: ultimate_credentials
        part: body
        regex:
          # ============ SECTION 1: AWS & CLOUD PROVIDERS ============
          # AWS Access Keys (All Formats)
          - '([^A-Z0-9]|^)(AKIA|A3T|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{12,}'
          - '(?:aws|AWS)_(?:access|secret)_(?:key|id|token)[\s:=]+["\']?([A-Za-z0-9/+=]{16,40})["\']?'
          - 'arn:aws:iam::[0-9]{12}:[A-Za-z0-9_/+=,.@-]+'
          - 'arn:aws:s3:::[\w.-]+'
          - 'arn:aws:ec2:[A-Za-z0-9-]+:[0-9]{12}:instance/i-[A-Za-z0-9]{8,17}'
          - 'arn:aws:rds:[A-Za-z0-9-]+:[0-9]{12}:db:[A-Za-z0-9-]+'
          - 'arn:aws:lambda:[A-Za-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+'
          - 'arn:aws:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9_-]+'
          - 'arn:aws:sqs:[A-Za-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+'
          - 'arn:aws:cloudformation:[A-Za-z0-9-]+:[0-9]{12}:stack/[A-Za-z0-9_-]+/[0-9a-f-]+'
          - 'arn:aws:ecs:[A-Za-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]+'
          - 'arn:aws:eks:[A-Za-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]+'
          - 's3://[a-zA-Z0-9-\.\_]+'
          - 's3-[a-zA-Z0-9-\.\\_/]+'
          - 's3\.amazonaws\.com/[a-zA-Z0-9-\.\_]+'
          - 's3\.console\.aws\.amazon\.com/s3/buckets/[a-zA-Z0-9-\._]+'
          - 's3\.amazonaws\.com[/]+|[a-zA-Z0-9_-]*\.s3\.amazonaws\.com'
          - '[a-zA-Z0-9-\.\_]+\.s3\.amazonaws\.com'

          # AWS IAM Roles
          - 'aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@-]+'
          - 'aws:iam::[0-9]{12}:user/[A-Za-z0-9_+=,.@-]+'
          - 'aws:iam::[0-9]{12}:policy/[A-Za-z0-9_+=,.@-]+'
          - 'aws:iam::[0-9]{12}:instance-profile/[A-Za-z0-9_+=,.@-]+'
          
          # AWS STS Tokens
          - 'AWS[A-Za-z0-9/+=]{40,100}'
          - 'ASIA[A-Z0-9]{16,}'
          - 'ASCA[A-Z0-9]{16,}'
          
          # AWS Config Patterns
          - 'aws_access_key_id\s*=\s*["\']?[A-Z0-9]{20}["\']?'
          - 'aws_secret_access_key\s*=\s*["\']?[A-Za-z0-9/+=]{40}["\']?'
          - 'aws_session_token\s*=\s*["\']?[A-Za-z0-9/+=]{50,500}["\']?'
          - 'AWS_ACCESS_KEY_ID["\s:=]+[A-Za-z0-9/+=]{16,40}'
          - 'AWS_SECRET_ACCESS_KEY["\s:=]+[A-Za-z0-9/+=]{16,40}'
          - 'AWS_SESSION_TOKEN["\s:=]+[A-Za-z0-9/+=]{50,500}'
          - 'AWS_DEFAULT_REGION["\s:=]+[A-Za-z0-9-]+'
          - 'AWS_REGION["\s:=]+[A-Za-z0-9-]+'
          - 'AWS_SECURITY_TOKEN["\s:=]+[A-Za-z0-9/+=]+'
          - 'AWS_ACCESS_KEY["\s:=]+[A-Za-z0-9/+=]{16,40}'

          # ============ SECTION 2: AZURE CREDENTIALS ============
          # Azure Connection Strings
          - 'Server=tcp:[A-Za-z0-9.-]+\.database\.windows\.net(?:,1433)?;Initial Catalog=[A-Za-z0-9._-]+;Persist Security Info=(?:False|True);User ID=[A-Za-z0-9._-]+;Password=[A-Za-z0-9._-]+'
          - 'DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9/+=]{40,}'
          - 'DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[^;]+;EndpointSuffix=core\.windows\.net'
          - 'AzureWebJobsStorage=[^;]+;'
          - 'AzureWebJobsDashboard=[^;]+;'
          - 'AzureCacheForRedis:[A-Za-z0-9/+=]+'
          
          # Azure Blob Storage
          - 'https://[A-Za-z0-9-]+\.blob\.core\.windows\.net/[^"\s]+'
          - 'https://[A-Za-z0-9-]+\.queue\.core\.windows\.net/[^"\s]+'
          - 'https://[A-Za-z0-9-]+\.table\.core\.windows\.net/[^"\s]+'
          - 'https://[A-Za-z0-9-]+\.file\.core\.windows\.net/[^"\s]+'
          - 'https://[A-Za-z0-9-]+\.dfs\.core\.windows\.net/[^"\s]+'
          
          # Azure Key Vault
          - 'https://[A-Za-z0-9-]+\.vault\.azure\.net/secrets/[A-Za-z0-9-]+'
          - 'https://[A-Za-z0-9-]+\.vault\.azure\.net/keys/[A-Za-z0-9-]+'
          - 'https://[A-Za-z0-9-]+\.vault\.azure\.net/certificates/[A-Za-z0-9-]+'
          - 'https://[A-Za-z0-9-]+\.vault\.azure\.net/storage/[A-Za-z0-9-]+'
          
          # Azure Service Bus
          - 'Endpoint=sb://[A-Za-z0-9-]+\.servicebus\.windows\.net/;SharedAccessKeyName=[^;]+;SharedAccessKey=[^;]+'
          - 'Endpoint=sb://[A-Za-z0-9-]+\.servicebus\.windows\.net/;SharedAccessKey=[^;]+'
          - 'Endpoint=sb://[A-Za-z0-9-]+\.servicebus\.windows\.net/;SASKey=[^;]+'
          
          # Azure Cosmos DB
          - 'AccountEndpoint=https://[A-Za-z0-9-]+\.documents\.azure\.com:443/;AccountKey=[A-Za-z0-9/+=]+;'
          - 'AccountEndpoint=https://[A-Za-z0-9-]+\.documents\.azure\.com:443/;AccountKey=[^;]+'
          - 'https://[A-Za-z0-9-]+\.documents\.azure\.com:443/'
          
          # Azure Active Directory
          - 'tenantId:[A-Za-z0-9-]+'
          - 'tenant:[A-Za-z0-9-]+'
          - 'azure_tenant_id:[A-Za-z0-9-]+'
          - 'AZURE_TENANT_ID=[A-Za-z0-9-]+'
          - 'AZURE_CLIENT_ID=[A-Za-z0-9-]+'
          - 'AZURE_CLIENT_SECRET=[A-Za-z0-9._-]+'
          - 'AZURE_SUBSCRIPTION_ID=[A-Za-z0-9-]+'
          - 'AZURE_RESOURCE_GROUP=[A-Za-z0-9_-]+'
          
          # Azure App Service
          - 'APPINSIGHTS_INSTRUMENTATIONKEY=[A-Za-z0-9-]+'
          - 'APPLICATIONINSIGHTS_CONNECTION_STRING=[^;]+'
          - 'WEBSITE_CONTENTAZUREFILECONNECTIONSTRING=[^;]+'
          - 'WEBSITE_CONTENTSHARE=[A-Za-z0-9_-]+'
          - 'WEBSITE_NODE_DEFAULT_VERSION=[A-Za-z0-9.]+'
          - 'WEBSITE_RUN_FROM_PACKAGE=[A-Za-z0-9./_-]+'

          # ============ SECTION 3: GCP / GOOGLE CLOUD ============
          # GCP Service Account Keys
          - '"type":\s*"service_account"'
          - '"project_id":\s*"[A-Za-z0-9-]+"'
          - '"private_key_id":\s*"[A-Za-z0-9]+"'
          - '"private_key":\s*"-----BEGIN PRIVATE KEY-----[^"]+-----END PRIVATE KEY-----"'
          - '"client_email":\s*"[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.gserviceaccount\.com"'
          - '"client_id":\s*"[0-9]+"'
          - '"auth_uri":\s*"https://accounts\.google\.com/o/oauth2/auth"'
          - '"token_uri":\s*"https://oauth2\.googleapis\.com/token"'
          - '"auth_provider_x509_cert_url":\s*"https://www\.googleapis\.com/oauth2/v1/certs"'
          - '"client_x509_cert_url":\s*"https://www\.googleapis\.com/robot/v1/metadata/x509/[^"]+"'
          - '"universe_domain":\s*"googleapis\.com"'
          
          # Google API Keys
          - 'AIza[A-Za-z0-9_-]{35}'
          - '"AIza[A-Za-z0-9_-]{35}"'
          - 'apiKey":\s*"AIza[A-Za-z0-9_-]{35}"'
          - 'GOOGLE_API_KEY=[A-Za-z0-9_-]+'
          - 'google_api_key=[A-Za-z0-9_-]+'
          - 'gcloud_api_key=[A-Za-z0-9_-]+'
          
          # Google OAuth
          - 'ya29\.[A-Za-z0-9_-]+'
          - 'ya29\.[A-Za-z0-9_\-]{40,}'
          - 'GOOGLE_APPLICATION_CREDENTIALS=[^"\s]+'
          - 'GOOGLE_CLOUD_PROJECT=[A-Za-z0-9-]+'
          - 'GOOGLE_CLOUD_REGION=[A-Za-z0-9-]+'
          - 'GCLOUD_PROJECT=[A-Za-z0-9-]+'
          - 'GCLOUD_REGION=[A-Za-z0-9-]+'
          
          # Google Cloud Storage
          - 'gs://[A-Za-z0-9._-]+'
          - 'gsutil -m cp -r [A-Za-z0-9./_-]+'
          - 'gcloud auth activate-service-account [A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.gserviceaccount\.com'
          - 'gcloud config set project [A-Za-z0-9-]+'
          
          # Google Maps API
          - 'AIza[A-Za-z0-9_-]{35}'
          - 'google_maps_api_key=[A-Za-z0-9_-]+'
          - 'maps_api_key=[A-Za-z0-9_-]+'
          - 'gmp_key=[A-Za-z0-9_-]+'
          - 'google_map_key=[A-Za-z0-9_-]+'

          # ============ SECTION 4: GITHUB & GITLAB ============
          # GitHub Tokens
          - 'ghp_[A-Za-z0-9]{36}'
          - 'gho_[A-Za-z0-9]{36}'
          - 'ghu_[A-Za-z0-9]{36}'
          - 'ghs_[A-Za-z0-9]{36}'
          - 'ghp_[A-Za-z0-9_]{36,40}'
          - 'github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}'
          - 'GITHUB_TOKEN=[A-Za-z0-9_]+'
          - 'GITHUB_ACCESS_TOKEN=[A-Za-z0-9_]+'
          - 'GITHUB_SECRET=[A-Za-z0-9_]+'
          - 'GITHUB_API_TOKEN=[A-Za-z0-9_]+'
          
          # GitHub OAuth
          - 'github_oauth_[A-Za-z0-9_]+'
          - 'github_client_id=[A-Za-z0-9_]+'
          - 'github_client_secret=[A-Za-z0-9_]+'
          
          # GitLab Tokens
          - 'glpat-[A-Za-z0-9_-]{20}'
          - 'glcbt-[A-Za-z0-9_-]{20}'
          - 'glft-[A-Za-z0-9_-]{20}'
          - 'glptt-[A-Za-z0-9_-]{20}'
          - 'GITLAB_TOKEN=[A-Za-z0-9_]+'
          - 'GITLAB_ACCESS_TOKEN=[A-Za-z0-9_]+'
          - 'GITLAB_API_TOKEN=[A-Za-z0-9_]+'
          
          # Git Credentials
          - 'git@[A-Za-z0-9.-]+:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git'
          - 'https://[A-Za-z0-9_-]+:[A-Za-z0-9._-]+@[A-Za-z0-9.-]+/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+\.git'
          - '[A-Za-z0-9_-]*:[A-Za-z0-9_\\-]+@github\.com*'
          - '[A-Za-z0-9_-]*:[A-Za-z0-9_\\-]+@gitlab\.com*'
          - '[A-Za-z0-9_-]*:[A-Za-z0-9_\\-]+@bitbucket\.org*'

          # ============ SECTION 5: DATABASE CONNECTIONS ============
          # MySQL
          - 'mysql://[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?(?:/[A-Za-z0-9._-]+)?'
          - 'jdbc:mysql://[A-Za-z0-9.-]+:[0-9]+/[A-Za-z0-9._-]+?user=[A-Za-z0-9._-]+&password=[A-Za-z0-9._-]+'
          - 'DB_CONNECTION=mysql'
          - 'DB_HOST=[A-Za-z0-9.-]+'
          - 'DB_PORT=[0-9]+'
          - 'DB_DATABASE=[A-Za-z0-9._-]+'
          - 'DB_USERNAME=[A-Za-z0-9._-]+'
          - 'DB_PASSWORD=[A-Za-z0-9._-]+'
          - 'MYSQL_HOST=[A-Za-z0-9.-]+'
          - 'MYSQL_USER=[A-Za-z0-9._-]+'
          - 'MYSQL_PASSWORD=[A-Za-z0-9._-]+'
          - 'MYSQL_DATABASE=[A-Za-z0-9._-]+'
          - 'MYSQL_PORT=[0-9]+'
          - 'mysql_password=[A-Za-z0-9._-]+'
          - 'mysql_username=[A-Za-z0-9._-]+'
          
          # PostgreSQL
          - 'postgresql://[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?(?:/[A-Za-z0-9._-]+)?'
          - 'jdbc:postgresql://[A-Za-z0-9.-]+:[0-9]+/[A-Za-z0-9._-]+'
          - 'PG_HOST=[A-Za-z0-9.-]+'
          - 'PG_PORT=[0-9]+'
          - 'PG_DATABASE=[A-Za-z0-9._-]+'
          - 'PG_USER=[A-Za-z0-9._-]+'
          - 'PG_PASSWORD=[A-Za-z0-9._-]+'
          - 'POSTGRES_HOST=[A-Za-z0-9.-]+'
          - 'POSTGRES_USER=[A-Za-z0-9._-]+'
          - 'POSTGRES_PASSWORD=[A-Za-z0-9._-]+'
          - 'POSTGRES_DB=[A-Za-z0-9._-]+'
          - 'POSTGRES_PORT=[0-9]+'
          - 'postgres_password=[A-Za-z0-9._-]+'
          
          # MongoDB
          - 'mongodb(?:\+srv)?://[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?(?:/[A-Za-z0-9._-]+)?'
          - 'jdbc:mongodb://[A-Za-z0-9.-]+:[0-9]+/[A-Za-z0-9._-]+'
          - 'MONGO_HOST=[A-Za-z0-9.-]+'
          - 'MONGO_PORT=[0-9]+'
          - 'MONGO_DATABASE=[A-Za-z0-9._-]+'
          - 'MONGO_USER=[A-Za-z0-9._-]+'
          - 'MONGO_PASSWORD=[A-Za-z0-9._-]+'
          - 'MONGODB_HOST=[A-Za-z0-9.-]+'
          - 'MONGODB_USER=[A-Za-z0-9._-]+'
          - 'MONGODB_PASSWORD=[A-Za-z0-9._-]+'
          - 'MONGODB_DATABASE=[A-Za-z0-9._-]+'
          - 'mongo_password=[A-Za-z0-9._-]+'
          
          # Redis
          - 'redis://(?:[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@)?[A-Za-z0-9.-]+(?:[:][0-9]+)?(?:/[0-9]+)?'
          - 'REDIS_HOST=[A-Za-z0-9.-]+'
          - 'REDIS_PORT=[0-9]+'
          - 'REDIS_PASSWORD=[A-Za-z0-9._-]+'
          - 'REDIS_DB=[0-9]+'
          - 'redis_password=[A-Za-z0-9._-]+'
          
          # Elasticsearch
          - 'elasticsearch://[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?'
          - 'ELASTICSEARCH_HOST=[A-Za-z0-9.-]+'
          - 'ELASTICSEARCH_PORT=[0-9]+'
          - 'ELASTICSEARCH_USER=[A-Za-z0-9._-]+'
          - 'ELASTICSEARCH_PASSWORD=[A-Za-z0-9._-]+'
          - 'ES_HOST=[A-Za-z0-9.-]+'
          - 'ES_PORT=[0-9]+'
          - 'ES_USER=[A-Za-z0-9._-]+'
          - 'ES_PASSWORD=[A-Za-z0-9._-]+'
          
          # Cassandra
          - 'cassandra://[A-Za-z0-9._%+-]+:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?'
          - 'CASSANDRA_HOST=[A-Za-z0-9.-]+'
          - 'CASSANDRA_PORT=[0-9]+'
          - 'CASSANDRA_USER=[A-Za-z0-9._-]+'
          - 'CASSANDRA_PASSWORD=[A-Za-z0-9._-]+'
          
          # SQL Server
          - 'jdbc:sqlserver://[A-Za-z0-9.-]+(?:[:][0-9]+)?;databaseName=[A-Za-z0-9._-]+;user=[A-Za-z0-9._-]+;password=[A-Za-z0-9._-]+'
          - 'jdbc:sqlserver://[A-Za-z0-9.-]+(?:[:][0-9]+)?;DatabaseName=[A-Za-z0-9._-]+;User=[A-Za-z0-9._-]+;Password=[A-Za-z0-9._-]+'
          - 'SQL_SERVER_HOST=[A-Za-z0-9.-]+'
          - 'SQL_SERVER_USER=[A-Za-z0-9._-]+'
          - 'SQL_SERVER_PASSWORD=[A-Za-z0-9._-]+'
          - 'SQL_SERVER_DATABASE=[A-Za-z0-9._-]+'
          
          # Oracle
          - 'jdbc:oracle:thin:@[A-Za-z0-9.-]+(?:[:][0-9]+)?:[A-Za-z0-9._-]+'
          - 'jdbc:oracle:thin:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+@[A-Za-z0-9.-]+(?:[:][0-9]+)?:[A-Za-z0-9._-]+'
          - 'ORACLE_HOST=[A-Za-z0-9.-]+'
          - 'ORACLE_USER=[A-Za-z0-9._-]+'
          - 'ORACLE_PASSWORD=[A-Za-z0-9._-]+'
          - 'ORACLE_DATABASE=[A-Za-z0-9._-]+'

          # ============ SECTION 6: API KEYS & TOKENS ============
          # OpenAI
          - 'sk-[A-Za-z0-9]{48}'
          - 'sk-[A-Za-z0-9-_]{48}'
          - 'OPENAI_API_KEY=[A-Za-z0-9_]+'
          - 'openai_api_key=[A-Za-z0-9_]+'
          
          # Stripe
          - 'sk_live_[A-Za-z0-9]{24,}'
          - 'sk_test_[A-Za-z0-9]{24,}'
          - 'pk_live_[A-Za-z0-9]{24,}'
          - 'pk_test_[A-Za-z0-9]{24,}'
          - 'rk_live_[A-Za-z0-9]{24,}'
          - 'rk_test_[A-Za-z0-9]{24,}'
          - 'STRIPE_API_KEY=[A-Za-z0-9_]+'
          - 'stripe_api_key=[A-Za-z0-9_]+'
          - 'stripe_public_key=[A-Za-z0-9_]+'
          - 'stripe_secret_key=[A-Za-z0-9_]+'
          - 'STRIPE_PUBLISHABLE_KEY=[A-Za-z0-9_]+'
          - 'STRIPE_SECRET_KEY=[A-Za-z0-9_]+'
          
          # SendGrid
          - 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
          - 'SENDGRID_API_KEY=[A-Za-z0-9_]+'
          - 'sendgrid_api_key=[A-Za-z0-9_]+'
          - 'SENDGRID_USERNAME=[A-Za-z0-9._-]+'
          - 'SENDGRID_PASSWORD=[A-Za-z0-9._-]+'
          
          # Slack
          - 'xox[bap]-[0-9]{12}-[0-9]{12}-[0-9a-z]{24}'
          - 'xoxb-[A-Za-z0-9_-]{24,48}'
          - 'xoxp-[A-Za-z0-9_-]{72,}'
          - 'xoxa-[A-Za-z0-9_-]{24,48}'
          - 'xoxo-[A-Za-z0-9_-]{24,48}'
          - 'xoxr-[A-Za-z0-9_-]{24,48}'
          - 'SLACK_TOKEN=[A-Za-z0-9_]+'
          - 'slack_token=[A-Za-z0-9_]+'
          - 'SLACK_BOT_TOKEN=[A-Za-z0-9_]+'
          - 'slack_bot_token=[A-Za-z0-9_]+'
          - 'SLACK_WEBHOOK_URL=[A-Za-z0-9./_-]+'
          
          # Slack Webhooks
          - 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
          - 'https://hooks\.slack\.com/triggers/[A-Z0-9]+/[0-9]+/[A-Za-z0-9]+'
          
          # DigitalOcean
          - 'dop_v1_[A-Za-z0-9]{64}'
          - 'DO_API_TOKEN=[A-Za-z0-9_]+'
          - 'digitalocean_api_token=[A-Za-z0-9_]+'
          - 'DIGITALOCEAN_ACCESS_TOKEN=[A-Za-z0-9_]+'
          - 'DIGITALOCEAN_TOKEN=[A-Za-z0-9_]+'
          
          # Facebook
          - 'EA[A-Za-z0-9]{50,}'
          - 'EAA[A-Za-z0-9]{50,}'
          - 'FACEBOOK_APP_ID=[0-9]+'
          - 'FACEBOOK_APP_SECRET=[A-Za-z0-9_]+'
          - 'FACEBOOK_ACCESS_TOKEN=[A-Za-z0-9_]+'
          - 'fb_app_id=[0-9]+'
          - 'fb_app_secret=[A-Za-z0-9_]+'
          
          # Twitter
          - 'twitter.*[1-9][0-9]+-[0-9a-zA-Z]{40}'
          - 'TWITTER_API_KEY=[A-Za-z0-9_]+'
          - 'TWITTER_API_SECRET=[A-Za-z0-9_]+'
          - 'TWITTER_ACCESS_TOKEN=[A-Za-z0-9_]+'
          - 'TWITTER_ACCESS_TOKEN_SECRET=[A-Za-z0-9_]+'
          - 'twitter_api_key=[A-Za-z0-9_]+'
          - 'twitter_api_secret=[A-Za-z0-9_]+'
          
          # Mailchimp
          - '[A-Za-z0-9]{32}-us[0-9]{1,2}'
          - 'MAILCHIMP_API_KEY=[A-Za-z0-9_]+'
          - 'mailchimp_api_key=[A-Za-z0-9_]+'
          
          # Mailgun
          - 'mailgun_[A-Za-z0-9_]+'
          - 'MAILGUN_API_KEY=[A-Za-z0-9_]+'
          - 'mailgun_api_key=[A-Za-z0-9_]+'
          - 'MAILGUN_DOMAIN=[A-Za-z0-9._-]+'
          - 'MAILGUN_SMTP_LOGIN=[A-Za-z0-9._-]+'
          - 'MAILGUN_SMTP_PASSWORD=[A-Za-z0-9._-]+'
          
          # Twilio
          - 'AC[a-f0-9]{32}'
          - 'SK[a-f0-9]{32}'
          - 'TWILIO_ACCOUNT_SID=[A-Za-z0-9_]+'
          - 'TWILIO_AUTH_TOKEN=[A-Za-z0-9_]+'
