      - type: status
        status:
          - 200
          - 201
          - 202
          - 203
          - 204
          - 206
          - 301
          - 302
          - 303
          - 307
          - 308
          - 400
          - 401
          - 403
          - 404
          - 405
          - 406
          - 409
          - 410
          - 415
          - 418
          - 429
          - 500
          - 501
          - 502
          - 503
          - 504

      # ============ RESPONSE VALIDATORS ============
      - type: word
        part: body
        words:
          - 'password'
          - 'secret'
          - 'key'
          - 'token'
          - 'credential'
          - 'auth'
          - 'api'
          - 'access'
          - 'private'
          - 'public'
          - 'pwd'
          - 'pass'
          - 'credentials'
          - 'apikey'
          - 'access_key'
          - 'secret_key'
          - 'auth_token'
          - 'bearer'
          - 'jwt'
          - 'oauth'
          - 's3'
          - 'bucket'
          - 'database'
          - 'connection'
          - 'host'
          - 'port'
          - 'username'
          - 'user'
          - 'login'
        condition: or
